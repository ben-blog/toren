    <link rel="stylesheet" href="style.css" />
    <style>
      :root {
        --red: #c0392b;
      }

      /* ─── KEYFRAMES ─────────────────────────────────────────────────── */
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .fade {
        opacity: 0;
        transform: translateY(18px);
        transition:
          opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
          transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .fade.in {
        opacity: 1;
        transform: none;
      }

      /* ─── POST HERO ────────────────────────────────────────────────── */
      .post-hero {
        padding: 200px var(--pad-h) 96px;
        position: relative;
        overflow: hidden;
        background: var(--obsidian);
        border-bottom: none;
      }
      .post-hero-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 42%;
        display: block;
        z-index: 0;
      }
      .post-hero-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(to bottom, rgba(10, 10, 10, 0.5) 0%, rgba(10, 10, 10, 0.82) 100%);
        z-index: 1;
      }
      .post-hero > *:not(.post-hero-bg):not(.post-hero-overlay) {
        position: relative;
        z-index: 2;
      }
      .post-eyebrow {
        font-family: var(--font-en);
        font-size: 10px;
        letter-spacing: 0.22em;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.55);
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 24px;
        opacity: 0;
        animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
      }
      .post-eyebrow::before {
        content: '';
        width: 28px;
        height: 1px;
        background: rgba(255, 255, 255, 0.35);
        flex-shrink: 0;
      }
      .post-title {
        font-family: var(--font-en);
        font-size: clamp(26px, 3.8vw, 52px);
        font-weight: 400;
        color: #fff;
        line-height: 1.15;
        letter-spacing: 0.015em;
        max-width: 900px;
        margin-bottom: 24px;
        opacity: 0;
        animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both;
      }
      .post-title em {
        font-style: italic;
        color: rgba(255, 255, 255, 0.65);
      }
      .post-subtitle {
        font-family: var(--font-en);
        font-size: clamp(15px, 1.3vw, 18px);
        font-weight: 400;
        color: rgba(255, 255, 255, 0.62);
        line-height: 1.7;
        max-width: 760px;
        margin-bottom: 40px;
        opacity: 0;
        animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both;
      }
      .post-meta {
        display: flex;
        align-items: center;
        gap: 18px;
        font-family: var(--font-en);
        font-size: 11px;
        letter-spacing: 0.1em;
        color: rgba(255, 255, 255, 0.38);
        text-transform: uppercase;
        opacity: 0;
        animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.65s both;
      }
      .post-meta-dot {
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
      }
      body.ko .post-title {
        font-family: var(--font-kr);
        font-weight: 500;
        letter-spacing: -0.01em;
        line-height: 1.32;
      }
      body.ko .post-subtitle {
        font-family: var(--font-kr);
        line-height: 1.75;
      }

      /* ─── ARTICLE BODY ─────────────────────────────────────────────── */
      .post-body {
        max-width: 960px;
        margin: 0 auto;
        padding: 72px var(--pad-h) 88px;
      }
      .post-body > * {
        margin-bottom: 26px;
      }
      .post-body p {
        font-family: var(--font-en);
        font-size: 17px;
        line-height: 1.75;
        color: var(--obsidian);
        letter-spacing: 0.005em;
      }
      body.ko .post-body p {
        font-family: var(--font-kr);
        font-size: 16px;
        line-height: 1.85;
        letter-spacing: -0.005em;
      }
      .post-body em {
        font-style: italic;
        color: var(--obsidian);
      }
      .post-body b,
      .post-body strong {
        font-weight: 600;
        color: var(--obsidian);
      }
      .post-body a {
        color: var(--navy);
        text-decoration: underline;
        text-underline-offset: 2px;
        text-decoration-thickness: 1px;
        text-decoration-color: rgba(27, 42, 78, 0.35);
        transition: text-decoration-color 0.2s;
      }
      .post-body a:hover {
        text-decoration-color: var(--navy);
      }

      /* lead paragraph */
      .post-lead {
        font-size: 20px !important;
        line-height: 1.7 !important;
        color: var(--obsidian) !important;
      }
      body.ko .post-lead {
        font-size: 19px !important;
        line-height: 1.8 !important;
      }
      .post-lead strong {
        color: var(--red) !important;
        font-weight: 700;
      }

      /* emphatic inline question */
      .post-question {
        font-family: var(--font-en) !important;
        font-size: clamp(20px, 2.2vw, 26px) !important;
        font-weight: 500 !important;
        color: var(--obsidian) !important;
        line-height: 1.5 !important;
        letter-spacing: 0.01em !important;
        margin: 44px 0 !important;
      }
      body.ko .post-question {
        font-family: var(--font-kr) !important;
        font-weight: 600 !important;
        letter-spacing: -0.012em !important;
        line-height: 1.55 !important;
      }

      .post-body h2 {
        font-family: var(--font-en);
        font-size: clamp(22px, 2.4vw, 30px);
        font-weight: 400;
        line-height: 1.25;
        letter-spacing: 0.015em;
        color: var(--obsidian);
        margin-top: 64px;
        margin-bottom: 24px;
        padding-top: 8px;
      }
      body.ko .post-body h2 {
        font-family: var(--font-kr);
        font-weight: 500;
        letter-spacing: -0.008em;
        line-height: 1.4;
      }
      .post-body h2::before {
        content: '';
        display: block;
        width: 32px;
        height: 1px;
        background: var(--navy);
        margin-bottom: 28px;
        opacity: 0.85;
      }

      /* ─── FIGURE ───────────────────────────────────────────────────── */
      .post-figure {
        margin: 48px auto;
      }
      .post-figure .figframe {
        border: 1px solid var(--hairline);
        border-radius: 2px;
        overflow: hidden;
        background: var(--ivory);
      }
      .post-figure img {
        display: block;
        width: 100%;
        height: auto;
      }
      .post-figcaption {
        margin-top: 15px;
        font-family: var(--font-en);
        font-size: 13px;
        line-height: 1.7;
        color: var(--mist);
      }
      body.ko .post-figcaption {
        font-family: var(--font-kr);
        font-size: 13px;
        letter-spacing: -0.005em;
      }
      .post-figcaption b {
        color: var(--slate);
        font-weight: 600;
      }

      /* ─── SPLIT (two failure modes) ────────────────────────────────── */
      .post-split {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin: 44px 0;
      }
      .post-split section {
        border: 1px solid var(--hairline);
        border-radius: 2px;
        padding: 26px 28px;
        background: var(--ivory);
        position: relative;
      }
      .post-split section::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 3px;
        background: var(--red);
      }
      .post-split h3 {
        font-family: var(--font-en);
        font-size: 16px;
        font-weight: 600;
        color: var(--obsidian);
        margin-bottom: 10px;
        letter-spacing: 0.01em;
      }
      body.ko .post-split h3 {
        font-family: var(--font-kr);
      }
      .post-body .post-split p {
        font-family: var(--font-en) !important;
        font-size: 14.5px !important;
        line-height: 1.7 !important;
        color: var(--slate) !important;
        margin: 0 !important;
        letter-spacing: 0 !important;
      }
      body.ko .post-body .post-split p {
        font-family: var(--font-kr) !important;
        font-size: 14px !important;
      }

      /* ─── CLOSING NOTE ─────────────────────────────────────────────── */
      .post-note {
        border-top: 1px solid var(--hairline);
        padding-top: 28px;
        margin-top: 48px;
        font-family: var(--font-en);
        font-size: 13.5px;
        line-height: 1.78;
        color: var(--mist);
        font-style: italic;
      }
      body.ko .post-note {
        font-family: var(--font-kr);
        font-size: 13px;
        letter-spacing: -0.005em;
      }

      /* ─── ABOUT / AUTHOR BOX ───────────────────────────────────────── */
      .post-about {
        margin-top: 56px;
        padding: 32px 34px;
        background: var(--ivory);
        border: 1px solid var(--hairline);
        border-radius: 2px;
      }
      .post-about-label {
        font-family: var(--font-en);
        font-size: 10px;
        letter-spacing: 0.22em;
        font-weight: 700;
        color: var(--navy);
        text-transform: uppercase;
        margin-bottom: 14px;
      }
      .post-about p {
        font-family: var(--font-en);
        font-size: 15px;
        line-height: 1.7;
        color: var(--slate);
        margin: 0;
      }
      body.ko .post-about p {
        font-family: var(--font-kr);
        font-size: 14.5px;
        line-height: 1.8;
        letter-spacing: -0.005em;
      }
      .post-about p b {
        color: var(--obsidian);
        font-weight: 600;
      }
      .post-about-links {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        margin-top: 22px;
      }
      .post-about-links a {
        font-family: var(--font-en);
        font-size: 11px;
        letter-spacing: 0.1em;
        font-weight: 700;
        color: var(--navy);
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: gap 0.2s;
      }
      body.ko .post-about-links a {
        font-family: var(--font-kr);
        letter-spacing: 0.02em;
      }
      .post-about-links a:hover {
        gap: 10px;
      }

      .post-divider {
        display: flex;
        justify-content: center;
        margin: 64px 0;
      }
      .post-divider span {
        width: 36px;
        height: 1px;
        background: var(--hairline);
      }

      /* ─── POST FOOTER ──────────────────────────────────────────────── */
      .post-footer {
        max-width: 960px;
        margin: 0 auto;
        padding: 0 var(--pad-h) 80px;
      }
      .post-footer-rule {
        width: 100%;
        height: 1px;
        background: var(--hairline);
        margin-bottom: 40px;
      }
      .post-share {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 48px;
        flex-wrap: wrap;
      }
      .post-share-label {
        font-family: var(--font-en);
        font-size: 10px;
        letter-spacing: 0.22em;
        font-weight: 700;
        color: var(--mist);
        text-transform: uppercase;
      }
      .post-share-buttons {
        display: flex;
        gap: 8px;
      }
      .share-btn {
        font-family: var(--font-en);
        font-size: 11px;
        letter-spacing: 0.08em;
        font-weight: 500;
        color: var(--slate);
        background: var(--white);
        border: 1px solid var(--hairline);
        border-radius: 2px;
        padding: 8px 16px;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: all 0.2s;
      }
      .share-btn:hover {
        border-color: var(--navy);
        color: var(--navy);
      }
      .share-btn.copied {
        background: var(--navy);
        border-color: var(--navy);
        color: var(--white);
      }

      .post-nav {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-top: 48px;
      }
      .post-nav-item {
        border: 1px solid var(--hairline);
        border-radius: 2px;
        padding: 24px;
        text-decoration: none;
        display: block;
        transition: all 0.25s;
        background: var(--white);
      }
      .post-nav-item:hover {
        border-color: var(--navy);
        background: var(--ivory);
      }
      .post-nav-item.disabled {
        opacity: 0.35;
        pointer-events: none;
      }
      .post-nav-dir {
        font-family: var(--font-en);
        font-size: 10px;
        letter-spacing: 0.22em;
        font-weight: 700;
        color: var(--mist);
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      .post-nav-item.next .post-nav-dir {
        justify-content: flex-end;
      }
      .post-nav-item.next {
        text-align: right;
      }
      .post-nav-title {
        font-family: var(--font-en);
        font-size: 15px;
        font-weight: 400;
        color: var(--obsidian);
        line-height: 1.4;
      }
      body.ko .post-nav-title {
        font-family: var(--font-kr);
        font-weight: 500;
        line-height: 1.45;
      }

      /* ─── RESPONSIVE ───────────────────────────────────────────────── */
      @media (max-width: 960px) {
        .post-hero {
          padding: 150px 28px 72px;
        }
        .post-body {
          padding: 56px 28px 64px;
        }
        .post-body h2 {
          margin-top: 48px;
        }
        .post-footer {
          padding: 0 28px 56px;
        }
        .post-nav {
          grid-template-columns: 1fr;
          gap: 10px;
        }
      }
      @media (max-width: 560px) {
        .post-hero {
          padding: 120px 20px 56px;
        }
        .post-body {
          padding: 40px 20px 48px;
        }
        .post-body p {
          font-size: 16px;
        }
        body.ko .post-body p {
          font-size: 15.5px;
        }
        .post-split {
          grid-template-columns: 1fr;
        }
        .post-footer {
          padding: 0 20px 48px;
        }
      }

      /* ─── READING PROGRESS ─────────────────────────────────────────── */
      #reading-progress {
        position: fixed;
        top: 0;
        left: 0;
        width: 0%;
        height: 2px;
        background: var(--navy);
        z-index: 2000;
        transition: width 0.08s linear;
        pointer-events: none;
      }

      /* ─── STICKY TOC ───────────────────────────────────────────────── */
      #post-toc {
        display: none;
      }
      @media (min-width: 1280px) {
        #post-toc {
          display: none; /* JS shows it after scroll */
          position: fixed;
          top: 50%;
          transform: translateY(-50%);
          right: 36px;
          width: 178px;
        }
        #post-toc.toc-visible {
          display: block;
        }
        #post-toc .toc-label {
          font-family: var(--font-en);
          font-size: 9px;
          letter-spacing: 0.22em;
          font-weight: 700;
          color: #999;
          text-transform: uppercase;
          margin-bottom: 14px;
        }
        #post-toc ol {
          list-style: none;
          padding: 0;
          margin: 0;
          border-left: 1px solid #ddd;
        }
        #post-toc ol li a {
          display: block;
          padding: 6px 0 6px 14px;
          font-family: var(--font-en);
          font-size: 11px;
          line-height: 1.5;
          color: #666;
          text-decoration: none;
          border-left: 2px solid transparent;
          margin-left: -1px;
          transition:
            color 0.2s,
            border-color 0.2s;
        }
        body.ko #post-toc ol li a {
          font-family: var(--font-kr);
        }
        #post-toc ol li a:hover {
          color: #333;
        }
        #post-toc ol li a.toc-active {
          color: #1b2a4e;
          border-left-color: #1b2a4e;
          font-weight: 600;
        }
      }

      /* ─── SECTION NUMBERS ──────────────────────────────────────────── */
      .sec-num {
        display: block;
        font-family: var(--font-en);
        font-size: 10px;
        letter-spacing: 0.22em;
        font-weight: 700;
        color: var(--navy);
        margin-bottom: 6px;
      }

      /* ─── BQ FEATURE (dark callout block) ──────────────────────────── */
      .bq-feature {
        background: var(--obsidian);
        padding: 56px 48px;
        margin: 64px 0;
        border-radius: 2px;
      }
      .bq-feature blockquote {
        border-left: none;
        padding: 0;
        margin: 0 auto;
        text-align: center;
        max-width: 720px;
        color: var(--white);
        font-family: var(--font-en);
        font-size: clamp(20px, 2.2vw, 27px);
        font-weight: 500;
        line-height: 1.6;
      }
      body.ko .bq-feature blockquote {
        font-family: var(--font-kr);
        font-size: clamp(19px, 2vw, 25px);
        line-height: 1.7;
        letter-spacing: -0.01em;
      }
      .bq-feature blockquote p {
        margin: 0;
        color: rgba(255, 255, 255, 0.9);
        font-family: inherit;
        font-size: inherit;
        font-weight: inherit;
        line-height: inherit;
      }
      .bq-feature blockquote p + p {
        margin-top: 16px;
        color: rgba(255, 255, 255, 0.6);
        font-size: 0.66em;
        font-weight: 400;
      }
      @media (max-width: 560px) {
        .bq-feature {
          padding: 52px 20px;
        }
      }

      /* ─── POST CTA ─────────────────────────────────────────────────── */
      .post-cta {
        background: var(--navy);
        padding: 88px var(--pad-h);
        text-align: center;
      }
      .post-cta-eyebrow {
        font-family: var(--font-en);
        font-size: 10px;
        letter-spacing: 0.22em;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.4);
        text-transform: uppercase;
        margin-bottom: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .post-cta-eyebrow::before,
      .post-cta-eyebrow::after {
        content: '';
        width: 22px;
        height: 1px;
        background: rgba(255, 255, 255, 0.28);
      }
      .post-cta-heading {
        font-family: var(--font-en);
        font-size: clamp(22px, 2.6vw, 36px);
        font-weight: 400;

    <script>
      let currentLang = 'ko';

      function goIndex(hash, tab) {
        let url = 'index.html?lang=' + currentLang;
        if (tab) url += '&tab=' + tab;
        url += hash || '';
        window.location.href = url;
      }
      function togMob() {
        document.getElementById('mobNav').classList.toggle('open');
      }
      function closeMob() {
        document.getElementById('mobNav').classList.remove('open');
      }

      window.addEventListener(
        'scroll',
        () => {
          document.getElementById('nav').classList.toggle('scrolled', scrollY > 30);
        },
        { passive: true }
      );

      const io = new IntersectionObserver(
        (entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) {
              e.target.classList.add('in');
              io.unobserve(e.target);
            }
          });
        },
        { threshold: 0.08 }
      );
      document.querySelectorAll('.fade').forEach((el) => io.observe(el));

      /* ── share ────────────────────────────────────────────────────── */
      function copyLink(btn) {
        navigator.clipboard.writeText(window.location.href).then(() => {
          btn.classList.add('copied');
          btn.textContent = T[currentLang]['share-copied'];
          setTimeout(() => {
            btn.classList.remove('copied');
            btn.textContent = T[currentLang]['share-copy'];
          }, 1800);
        });
      }
      function setupShareLinks() {
        const url = encodeURIComponent(window.location.href);
        const title = encodeURIComponent(document.title);
        document.getElementById('share-x').href = `https://twitter.com/intent/tweet?text=${title}&url=${url}`;
        document.getElementById('share-li').href = `https://www.linkedin.com/sharing/share-offsite/?url=${url}`;
      }

      /* ── i18n ─────────────────────────────────────────────────────── */
      const T = {
        ko: {
          'post-eyebrow': 'Insight — by ImperAI',
          'post-title': '신뢰는, <em>인프라입니다.</em>',
          'post-subtitle': 'UBS 최고 AI 책임자의 한마디에서 시작하는, AI 신뢰에 관한 이야기.',
          'post-meta-author': 'Imperai',
          'post-meta-date': '2026년 7월',
          'post-meta-read': '읽는 시간 8분',

          'p-lead':
            '얼마 전 <a href="https://www.theinformation.com/titv/qtanb" target="_blank" rel="noopener">The Information</a>에 UBS 최고 AI 책임자 다니엘레 마가체니(Daniele Magazzeni)의 짧은 인터뷰가 올라왔습니다. AI 도입을 가로막는 게 무엇이냐는 질문에, 그는 이렇게 답합니다. 결국 <strong>“모델을 신뢰할 수 있느냐(the ability to trust the model)”</strong>의 문제라고요.',
          'p-intro-1':
            '맞는 말입니다. 그런데 이 대답을 곱씹다 보니, 어딘가 좀 걸리는 데가 있더라고요. 하필 <em>은행</em>의 AI 책임자가, 신뢰를 모델 안에서 찾고 있으니까요. 사실 이건 마가체니 혼자만의 이야기가 아닙니다. AI 관련 발표 자료들을 보다 보면 이런 표현이 써 있는 경우가 참 많거든요. <b>Build Trust into AI.</b> AI에 신뢰를 심자, 신뢰를 내장하자. 나무랄 데 없는 구호입니다. 그런데 이렇게 멀쩡해 보이는 문장일수록 함정이 있습니다. 신뢰가 어디서 생기는지를 슬쩍 잘못 짚고 있거든요.',

          'h2-1': '완벽한 모델도, 신뢰를 주지는 못합니다',
          'p-1-1':
            '자, 마가체니의 바람대로 완벽하게 신뢰성 있고 정확한 모델이 하나 있다고 해 봅시다. 정렬(Alignment)도 완벽하고, 가드레일도 촘촘하고, 안전성 검증까지 전부 끝냈습니다. 이 모델을 회사에 들였습니다.',
          'q-1': '이제 여러분은 그 모델을 ‘신뢰’할 수 있을까요?',
          'p-1-2':
            '저는 아니라고 생각합니다. ‘신뢰를 AI에 내장한다’는 말은, 신뢰를 모델이 가진 ‘성질’로 본다는 겁니다. 잘 정렬하고 잘 학습시키고 가드레일만 잘 걸면, 그 결과물이 ‘믿을 만한’ 물건이 된다는 건데요. 마치 신뢰가 가중치 어딘가에 스며드는 성분이라도 되는 것처럼요. 그런데 웬만큼 굴러가는 시스템을 들여다보면, 신뢰는 그런 식으로 생기는 게 아닙니다.',
          'callout-1':
            '<p>신뢰는 그 물건이 얼마나 훌륭한가가 아니라,<br />그 물건을 둘러싼 구조가 만들어 냅니다.</p>',

          'h2-2': '은행 — 가장 오래된 증거',
          'p-2-1':
            '신뢰가 구조에서 나온다는 걸 가장 오래, 가장 잘 보여준 곳이 바로 은행입니다. 마가체니가 일하는 바로 그 은행 말이죠. 복식부기가 상업을 뿌리부터 바꿔 놓은 건 상인을 정직하게 만들어서가 아니었습니다. 장부를 속이려면 양쪽에 두 번 적어야 하고, 두 번 적어도 대차는 맞지 않으니까요. 복식부기는 ‘정직함’을 요구하는 대신, ‘부정직함’이 그 자리에서 드러나게 만들었습니다. 신뢰의 무게를 사람의 ‘성품’에서 장부의 ‘구조’로 옮겨 버린 겁니다. 그래서 우리는 은행원이 착해서 은행을 믿는 게 아닙니다. 대차가 맞아야만 하는 장부, 그걸 대조하는 감사, 틀리면 답해야 하는 규정이 있어서 믿는 거예요. 이런 신뢰는 나쁜 사람이 섞여 들어도, 담당자가 바뀌어도 흔들리지 않습니다. 애초에 개인의 선함에 의존하지 않으니까요.',

          'h2-3': '도로 — 낯선 이를 믿게 하는 구조',
          'p-3-1':
            '조금 더 가까운 예도 있습니다. 우리는 매일 도로에서 한 번도 본 적 없는 사람들과 나란히 운전을 하는데요. 옆 차선 운전자가 누구인지, 얼마나 조심스러운 사람인지 알 길이 없지만, 아무렇지 않게 그 사이를 달립니다. 다들 선량하고 침착한 운전자여서가 아니고요. 신호등과 교통 관제가 흐름을 정리하고, 교통법규와 면허 제도가 누가 어떻게 달릴 수 있는지를 미리 정해 두고, 사고가 나면 블랙박스와 사고 기록이 무슨 일이 있었는지를 남깁니다. 그리고 그 맨 끝에 보험이 있죠. 보험은 운전자를 더 안전하게 만들지는 않지만, 대신에 뭔가 잘못됐을 때 누가 얼마를 책임질지를 미리 정해 둡니다. 모든 차가 보험에 들어야 하고, 과실이 나뉘고, 배상이 이뤄지죠. 결국 우리가 그 낯선 이들 사이에서 안심하는 건 모두가 완벽하게 운전해서가 아닙니다. 누군가 완벽하게 운전하지 <em>않았을</em> 때, 기록이 남고 규칙이 판정하고 책임질 사람이 정해지기 때문이죠.',
          'fig1-cap':
            '<b>그림.</b> 은행도, 도로도, AI도 — 도메인은 달라도 신뢰를 만드는 구조는 같습니다. 실행 전 게이트, 무슨 일이 있었는지 남기는 기록, 그리고 누가 답할지를 정하는 책임.',

          'h2-4': 'AI 에이전트의 세 가지 질문',
          'p-4-1':
            'AI 에이전트도 다르지 않습니다. 앞에서 상상한, 그 완벽하게 신뢰성 있는 에이전트로 돌아가 볼까요. 그게 조직에 신뢰를 줄까요? 그렇지 않습니다. 기업이 실제로 부딪히는 질문은 ‘이 AI가 착한가’가 아니거든요. 이 AI가 뭔가를 실행했을 때 그 행적이 기록으로 남는가, 해서는 안 될 일을 미리 막을 수 있는가, 일이 터진 뒤에 누군가 그걸 두고 답할 수 있는가 — 진짜 질문은 이 셋입니다. 자동차로 치면 사고 기록이고, 신호등이고, 보험이죠. 그리고 이 셋 중 어느 것도 모델 안에는 없습니다. 전부 모델 바깥, 에이전트가 내리는 모든 결정이 지나가는 통제 평면(control plane)에 있고요.',

          'h2-5': '희망을 사실로 바꾸는 것',
          'p-5-1':
            '<strong>확인할 수 없는 신뢰는 신뢰가 아니라 희망입니다.</strong> “이 모델은 믿을 만합니다”라는 말은, 확인되기 전까지는 그냥 마케팅이고요. 신뢰의 반대는 불신이 아니라, 확인이 안 된다는 것입니다. 인프라가 하는 일이 바로 이 희망을 확인 가능한 사실로 바꿔 주는 겁니다. 결정이 실행되기 전에 막아서는 게이트, 무엇을·왜·누구의 권한으로·무엇을 근거로 했는지 네 칸이 채워진 결정 기록 한 줄, 나중에 그 줄을 되짚을 수 있는 흔적. 이게 갖춰졌을 때 비로소 ‘믿는다’가 ‘확인했다’로 바뀝니다. 규제 심사관 앞에서도, 사고가 터진 뒤 열리는 회의에서도, 감사 자리에서도 필요한 건 착한 모델이 아니라 답할 수 있는 기록이거든요. ‘선의’는 감사받을 수 없습니다. ‘기록’은 감사받을 수 있고요.',

          'h2-6': '차이는 규모에서 드러납니다',
          'p-6-1':
            '솔직히 말씀드리면, 저도 한때는 모델만 잘 정렬하면 웬만한 건 풀린다고 여겼습니다. 지금은 아니고요. 오해는 마시길 바랍니다 — 모델 자체의 안전과 정렬은 물론 중요하고, 마가체니의 말도 그 점에선 옳은 말입니다. 잘 정렬된 모델은 인프라가 감당할 사고의 빈도를 낮추고, 좋은 레일 위에서 더 나은 결과를 냅니다. 다만 그건 신뢰의 필요조건이지, 충분조건은 못 됩니다. 이 차이가 규모에서 드러나는데요. 에이전트 하나를 공들여 정렬하는 건 할 수 있습니다. 그런데 조직 안 에이전트가 열, 백, 수천으로 불어나는 순간, ‘하나하나 착하게 만들자’는 방식은 복리로 쌓이지 않고 빈틈만 빠르게 커지고 늘어날 뿐입니다. 반대로 통제 평면은 에이전트가 늘어난 만큼 같이 커집니다. 결정이 몇이든 에이전트가 몇이든, 같은 게이트를 지나 같은 장부에 쌓이니까요.',
          'callout-2':
            '<p>규모를 확장할 때, 개인의 선함에 기댄 신뢰는 부러지지만<br />구조에 얹힌 신뢰는 버틸 수 있습니다.</p>',

          'h2-7': '구호를 뒤집어야 합니다',
          'p-7-1':
            '그러니 구호의 방향을 뒤집어야 합니다. AI에 신뢰를 심겠다고 매달리는 대신, 신뢰가 저절로 따라 나오는 구조를 깔아야 하는 거죠. 장부가 상거래에서, 관제와 보험이 도로에서 그랬듯이요. 목표는 ‘착한 AI’가 아니라 ‘답할 수 있는 AI’입니다. 식별하고, 통제하고, 증명하고, 최적화하는 구조가 제대로 돌아갈 때, 신뢰는 그 맨 끝에서 저절로 따라옵니다.',
          'p-7-2':
            'Build Trust into AI, 신뢰를 ‘안’(in)에 심으라는 말입니다. 그런데 신뢰는 늘 ‘사이’(between)에 있었어요. 행동하는 쪽과, 그를 붙드는 구조 사이에요. 신뢰는 모델이 돌아가는 ‘런타임’이 아니라, 그 밑을 받치는 ‘레일’에 있는 거예요.',
          'q-3':
            '우리는 지금 모델의 신뢰성과 정확성만 재고 있는 걸까요, 아니면 그 모델한테 답을 물을 수 있는 구조를 짓고 있는 걸까요?',
          'p-7-3': '어쩌면 진짜 걸림돌은, 아직도 모델만 들여다보고 있는 우리의 눈에 있는지도 모릅니다.',

        en: {
          'post-eyebrow': 'Insight — by ImperAI',
          'post-title': 'Trust is <em>infrastructure.</em>',
          'post-subtitle': 'A story about trust in AI, beginning with one line from UBS’s Chief AI Officer.',
          'post-meta-author': 'Imperai',
          'post-meta-date': 'July 2026',
          'post-meta-read': '8 min read',

          'p-lead':
            'A short interview with UBS Chief AI Officer Daniele Magazzeni ran on <a href="https://www.theinformation.com/titv/qtanb" target="_blank" rel="noopener">The Information</a> the other day. Asked what really blocks enterprise AI adoption, he gives a simple answer: it comes down to <strong>“the ability to trust the model.”</strong>',
          'p-intro-1':
            'He’s not wrong. But the more I sat with that answer, the more something nagged at me — because here is a <em>bank’s</em> AI chief, of all people, looking for trust inside the model. And it isn’t just Magazzeni. Walk through almost any AI deck these days and you’ll find some version of the same line. <b>Build Trust into AI.</b> Bake trust in; make it a feature. It’s a hard slogan to argue with — which is exactly the problem. A line this reasonable-sounding quietly points us to the wrong place; it misreads where trust actually comes from.',

          'h2-1': 'Even a perfect model won’t hand you trust',
          'p-1-1':
            'Suppose we had a model that was everything Magazzeni wants — perfectly reliable and accurate. Alignment nailed, guardrails tight, every safety eval passed. You bring it into your company.',
          'q-1': 'Can you now ‘trust’ it?',
          'p-1-2':
            'I don’t think so. To ‘build trust into AI’ is to treat trust as a property of the model — as if, once you align it well enough and wrap it in enough guardrails, the thing that comes out is ‘trustworthy.’ As if trust were a substance you could soak into the weights. But look at any system that actually works, and trust doesn’t form that way.',
          'callout-1':
            '<p>Trust isn’t a measure of how good the thing is.<br />It’s manufactured by the structure around it.</p>',

          'h2-2': 'Banking — the oldest proof',
          'p-2-1':
            'The oldest example is the one Magazzeni works in: the bank. Double-entry bookkeeping didn’t transform commerce by making merchants honest. To cook the books you have to write the lie twice, and even then the two sides won’t balance. Double-entry doesn’t demand ‘honesty’ — it makes ‘dishonesty’ show itself on the spot. It shifted the weight of trust off the person’s character and onto the structure of the ledger. That’s why we don’t trust a bank because the teller is a good person. We trust it because the books have to balance, because auditors reconcile them, because someone has to answer when they don’t. Trust like that doesn’t collapse when a bad actor slips in, or when the staff turns over. It was never resting on anyone’s goodness to begin with.',

          'h2-3': 'The road — trusting strangers by design',
          'p-3-1':
            'Here’s a closer one. Every day we drive alongside total strangers we’ve never met. We have no idea who’s in the next lane, or how careful they are — and we merge in anyway. Not because everyone on the road is decent and calm. Traffic lights and control systems order the flow; laws and licensing decide in advance who may drive and how; when something goes wrong, dashcams and accident reports preserve what happened. And at the far end sits insurance. Insurance doesn’t make drivers any safer — but it settles, ahead of time, who owes what when things go wrong. Every car has to be covered, fault gets apportioned, damages get paid. In the end we feel safe among strangers not because everyone drives perfectly, but because when someone <em>doesn’t</em>, there’s a record, a rule that adjudicates, and someone who answers.',
          'fig1-cap':
            '<b>Figure.</b> Banking, roads, AI — different domains, the same structure that makes trust: a gate before execution, a record of what happened, and accountability for who answers.',

          'h2-4': 'Three questions for an AI agent',
          'p-4-1':
            'AI agents are no different. Go back to that flawless, perfectly reliable agent. Does it hand the organization trust? It doesn’t. Because the question a company actually faces isn’t ‘is this AI good?’ It’s this: when the AI acts, is there a record of what it did; can the wrong thing be stopped before it happens; and when something breaks, is there someone who can answer for it? Those three. The accident report, the traffic light, the insurance. And none of them lives inside the model. They all sit outside it — in the control plane every agent decision passes through.',

          'h2-5': 'Turning hope into fact',
          'p-5-1':
            '<strong>Trust you can’t verify isn’t trust; it’s hope.</strong> “This model is trustworthy” is marketing until it’s checked. The opposite of trust isn’t distrust — it’s the inability to confirm. And that is exactly what infrastructure fixes: it turns the hope into something checkable. A gate that stands in front of a decision before it executes. One line of record with four fields filled in — what, why, on whose authority, on what basis. A trace you can walk back later. Only then does ‘I believe’ become ‘I checked.’ In front of a regulator, in the meeting after an incident, in an audit — what’s needed isn’t a good model but a record that can answer. Good intentions can’t be audited. A record can.',

          'h2-6': 'The gap shows up at scale',
          'p-6-1':
            'Honestly, I used to think that if you just aligned the model well enough, most of it took care of itself. I don’t anymore. Don’t get me wrong — a model’s own safety and alignment matter, and Magazzeni is right about that much. A well-aligned model lowers how often the infrastructure has to catch something, and it does better on good rails. But that’s a necessary condition for trust, not a sufficient one. And the gap opens up at scale. You can carefully align one agent. The moment there are ten, a hundred, a thousand, though, ‘make each one good’ doesn’t compound — the only thing that grows, and grows fast, is the surface where things slip through. A control plane, by contrast, grows with you. However many decisions, however many agents, they pass the same gate and land in the same ledger.',
          'callout-2':
            '<p>Trust that leans on individual goodness snaps at scale.<br />Trust that sits in the structure holds.</p>',

          'h2-7': 'Turn the slogan around',
          'p-7-1':
            'So the slogan needs turning around. Instead of straining to build trust into AI, build the structure that lets trust fall out on its own — the way the ledger did for commerce, and control and insurance did for the road. The goal isn’t a ‘good AI’; it’s an AI that can answer. When the structure that identifies, governs, proves, and optimizes is actually running, trust shows up at the end of it.',
          'p-7-2':
            'Build Trust into AI says put trust ‘inside.’ But trust has always lived ‘between’ — between the one who acts and the structure that holds them to it. Trust doesn’t live in the ‘runtime’ where the model runs; it lives on the ‘rails’ underneath.',
          'q-3':
            'Are we, right now, only measuring the reliability and accuracy of the model — or are we building the structure that can hold that model to answer?',
          'p-7-3': 'Maybe the real blocker is that we’re still only looking at the model.',

      /* ── section numbers ──────────────────────────────────────────── */
      function addSectionNumbers() {
        document.querySelectorAll('.post-body h2').forEach((h2, i) => {
          const existing = h2.querySelector('.sec-num');
          if (existing) existing.remove();
          const span = document.createElement('span');
          span.className = 'sec-num';
          span.textContent = String(i + 1).padStart(2, '0');
          h2.insertBefore(span, h2.firstChild);
        });
      }

      /* TOC: show after hero passes, highlight active section */
      const tocEl = document.getElementById('post-toc');
      const heroVisual = document.querySelector('.post-hero');

      function updateTocVisibility() {
        if (!heroVisual || !tocEl) return;
        const heroBottom = heroVisual.getBoundingClientRect().bottom;
        tocEl.classList.toggle('toc-visible', heroBottom < 0);
      }
      window.addEventListener('scroll', updateTocVisibility, { passive: true });
      updateTocVisibility();

      /* TOC click: prevent base-href redirect, scroll to section instead */
      const tocList = document.getElementById('toc-list');
      if (tocList) {
        tocList.addEventListener('click', function (e) {
          const a = e.target.closest('a[href^="#"]');
          if (!a) return;
          const id = a.getAttribute('href').slice(1);
          const target = document.getElementById(id);
          if (target) {
            e.preventDefault();
            const navEl = document.getElementById('nav');
            const offset = navEl ? navEl.offsetHeight + 16 : 88;
            const top = target.getBoundingClientRect().top + window.scrollY - offset;
            window.scrollTo({ top, behavior: 'smooth' });
          }
        });
      }

      /* active section highlight */
      const tocObserver = new IntersectionObserver(
        (entries) => {
          entries.forEach((e) => {
            const id = e.target.id;
            const link = document.querySelector(`#toc-list a[href="#${id}"]`);
            if (!link) return;
            if (e.isIntersecting) {
              document.querySelectorAll('#toc-list a').forEach((a) => a.classList.remove('toc-active'));
              link.classList.add('toc-active');
            }
          });
        },
        { rootMargin: '-15% 0px -75% 0px' }
      );
      document.querySelectorAll('.post-body h2[id]').forEach((h2) => tocObserver.observe(h2));

      /* ── reading progress ─────────────────────────────────────────── */
      (function () {
        const bar = document.getElementById('reading-progress');
        const article = document.querySelector('article');
        if (!bar || !article) return;
        window.addEventListener(
          'scroll',
          () => {
            const top = article.getBoundingClientRect().top + window.scrollY;
            const height = article.offsetHeight - window.innerHeight;
            const pct = Math.max(0, Math.min(100, ((window.scrollY - top) / height) * 100));
            bar.style.width = pct + '%';
          },
          { passive: true }
        );
      })();
