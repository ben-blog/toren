    <style>
      :root {
        --red: #c0392b;
      }

      /* ─── KEYFRAMES ─────────────────────────────────────────────────── */
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .fade {
        opacity: 0;
        transform: translateY(18px);
        transition:
          opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
          transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .fade.in {
        opacity: 1;
        transform: none;
      }

      /* ─── POST HERO ────────────────────────────────────────────────── */
      .post-hero {
        padding: 200px var(--pad-h) 96px;
        position: relative;
        overflow: hidden;
        background: var(--obsidian);
        border-bottom: none;
      }
      .post-hero-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 42%;
        display: block;
        z-index: 0;
      }
      .post-hero-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(to bottom, rgba(10, 10, 10, 0.5) 0%, rgba(10, 10, 10, 0.82) 100%);
        z-index: 1;
      }
      .post-hero > *:not(.post-hero-bg):not(.post-hero-overlay) {
        position: relative;
        z-index: 2;
      }
      .post-eyebrow {
        font-family: var(--font-en);
        font-size: 10px;
        letter-spacing: 0.22em;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.55);
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 24px;
        opacity: 0;
        animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
      }
      .post-eyebrow::before {
        content: '';
        width: 28px;
        height: 1px;
        background: rgba(255, 255, 255, 0.35);
        flex-shrink: 0;
      }
      .post-title {
        font-family: var(--font-en);
        font-size: clamp(26px, 3.8vw, 52px);
        font-weight: 400;
        color: #fff;
        line-height: 1.15;
        letter-spacing: 0.015em;
        max-width: 900px;
        margin-bottom: 24px;
        opacity: 0;
        animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both;
      }
      .post-title em {
        font-style: italic;
        color: rgba(255, 255, 255, 0.65);
      }
      .post-subtitle {
        font-family: var(--font-en);
        font-size: clamp(15px, 1.3vw, 18px);
        font-weight: 400;
        color: rgba(255, 255, 255, 0.62);
        line-height: 1.7;
        max-width: 760px;
        margin-bottom: 40px;
        opacity: 0;
        animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both;
      }
      .post-meta {
        display: flex;
        align-items: center;
        gap: 18px;
        font-family: var(--font-en);
        font-size: 11px;
        letter-spacing: 0.1em;
        color: rgba(255, 255, 255, 0.38);
        text-transform: uppercase;
        opacity: 0;
        animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.65s both;
      }
      .post-meta-dot {
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
      }
      body.ko .post-title {
        font-family: var(--font-kr);
        font-weight: 500;
        letter-spacing: -0.01em;
        line-height: 1.32;
      }
      body.ko .post-subtitle {
        font-family: var(--font-kr);
        line-height: 1.75;
      }

      /* ─── ARTICLE BODY ─────────────────────────────────────────────── */
      .post-body {
        max-width: 960px;
        margin: 0 auto;
        padding: 72px var(--pad-h) 88px;
      }
      .post-body > * {
        margin-bottom: 26px;
      }
      .post-body p {
        font-family: var(--font-en);
        font-size: 17px;
        line-height: 1.75;
        color: var(--obsidian);
        letter-spacing: 0.005em;
      }
      body.ko .post-body p {
        font-family: var(--font-kr);
        font-size: 16px;
        line-height: 1.85;
        letter-spacing: -0.005em;
      }
      .post-body em {
        font-style: italic;
        color: var(--obsidian);
      }
      .post-body b,
      .post-body strong {
        font-weight: 600;
        color: var(--obsidian);
      }
      .post-body a {
        color: var(--navy);
        text-decoration: underline;
        text-underline-offset: 2px;
        text-decoration-thickness: 1px;
        text-decoration-color: rgba(27, 42, 78, 0.35);
        transition: text-decoration-color 0.2s;
      }
      .post-body a:hover {
        text-decoration-color: var(--navy);
      }

      /* lead paragraph */
      .post-lead {
        font-size: 20px !important;
        line-height: 1.7 !important;
        color: var(--obsidian) !important;
      }
      body.ko .post-lead {
        font-size: 19px !important;
        line-height: 1.8 !important;
      }
      .post-lead strong {
        color: var(--red) !important;
        font-weight: 700;
      }

      /* emphatic inline question */
      .post-question {
        font-family: var(--font-en) !important;
        font-size: clamp(20px, 2.2vw, 26px) !important;
        font-weight: 500 !important;
        color: var(--obsidian) !important;
        line-height: 1.5 !important;
        letter-spacing: 0.01em !important;
        margin: 44px 0 !important;
      }
      body.ko .post-question {
        font-family: var(--font-kr) !important;
        font-weight: 600 !important;
        letter-spacing: -0.012em !important;
        line-height: 1.55 !important;
      }

      .post-body h2 {
        font-family: var(--font-en);
        font-size: clamp(22px, 2.4vw, 30px);
        font-weight: 400;
        line-height: 1.25;
        letter-spacing: 0.015em;
        color: var(--obsidian);
        margin-top: 64px;
        margin-bottom: 24px;
        padding-top: 8px;
      }
      body.ko .post-body h2 {
        font-family: var(--font-kr);
        font-weight: 500;
        letter-spacing: -0.008em;
        line-height: 1.4;
      }
      .post-body h2::before {
        content: '';
        display: block;
        width: 32px;
        height: 1px;
        background: var(--navy);
        margin-bottom: 28px;
        opacity: 0.85;
      }

      /* ─── FIGURE ───────────────────────────────────────────────────── */
      .post-figure {
        margin: 48px auto;
      }
      .post-figure .figframe {
        border: 1px solid var(--hairline);
        border-radius: 2px;
        overflow: hidden;
        background: var(--ivory);
      }
      .post-figure img {
        display: block;
        width: 100%;
        height: auto;
      }
      .post-figcaption {
        margin-top: 15px;
        font-family: var(--font-en);
        font-size: 13px;
        line-height: 1.7;
        color: var(--mist);
      }
      body.ko .post-figcaption {
        font-family: var(--font-kr);
        font-size: 13px;
        letter-spacing: -0.005em;
      }
      .post-figcaption b {
        color: var(--slate);
        font-weight: 600;
      }

      /* ─── SPLIT (two failure modes) ────────────────────────────────── */
      .post-split {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin: 44px 0;
      }
      .post-split section {
        border: 1px solid var(--hairline);
        border-radius: 2px;
        padding: 26px 28px;
        background: var(--ivory);
        position: relative;
      }
      .post-split section::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 3px;
        background: var(--red);
      }
      .post-split h3 {
        font-family: var(--font-en);
        font-size: 16px;
        font-weight: 600;
        color: var(--obsidian);
        margin-bottom: 10px;
        letter-spacing: 0.01em;
      }
      body.ko .post-split h3 {
        font-family: var(--font-kr);
      }
      .post-body .post-split p {
        font-family: var(--font-en) !important;
        font-size: 14.5px !important;
        line-height: 1.7 !important;
        color: var(--slate) !important;
        margin: 0 !important;
        letter-spacing: 0 !important;
      }
      body.ko .post-body .post-split p {
        font-family: var(--font-kr) !important;
        font-size: 14px !important;
      }

      /* ─── CLOSING NOTE ─────────────────────────────────────────────── */
      .post-note {
        border-top: 1px solid var(--hairline);
        padding-top: 28px;
        margin-top: 48px;
        font-family: var(--font-en);
        font-size: 13.5px;
        line-height: 1.78;
        color: var(--mist);
        font-style: italic;
      }
      body.ko .post-note {
        font-family: var(--font-kr);
        font-size: 13px;
        letter-spacing: -0.005em;
      }

      /* ─── ABOUT / AUTHOR BOX ───────────────────────────────────────── */
      .post-about {
        margin-top: 56px;
        padding: 32px 34px;
        background: var(--ivory);
        border: 1px solid var(--hairline);
        border-radius: 2px;
      }
      .post-about-label {
        font-family: var(--font-en);
        font-size: 10px;
        letter-spacing: 0.22em;
        font-weight: 700;
        color: var(--navy);
        text-transform: uppercase;
        margin-bottom: 14px;
      }
      .post-about p {
        font-family: var(--font-en);
        font-size: 15px;
        line-height: 1.7;
        color: var(--slate);
        margin: 0;
      }
      body.ko .post-about p {
        font-family: var(--font-kr);
        font-size: 14.5px;
        line-height: 1.8;
        letter-spacing: -0.005em;
      }
      .post-about p b {
        color: var(--obsidian);
        font-weight: 600;
      }
      .post-about-links {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        margin-top: 22px;
      }
      .post-about-links a {
        font-family: var(--font-en);
        font-size: 11px;
        letter-spacing: 0.1em;
        font-weight: 700;
        color: var(--navy);
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: gap 0.2s;
      }
      body.ko .post-about-links a {
        font-family: var(--font-kr);
        letter-spacing: 0.02em;
      }
      .post-about-links a:hover {
        gap: 10px;
      }

      .post-divider {
        display: flex;
        justify-content: center;
        margin: 64px 0;
      }
      .post-divider span {
        width: 36px;
        height: 1px;
        background: var(--hairline);
      }

      /* ─── POST FOOTER ──────────────────────────────────────────────── */
      .post-footer {
        max-width: 960px;
        margin: 0 auto;
        padding: 0 var(--pad-h) 80px;
      }
      .post-footer-rule {
        width: 100%;
        height: 1px;
        background: var(--hairline);
        margin-bottom: 40px;
      }
      .post-share {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 48px;
        flex-wrap: wrap;
      }
      .post-share-label {
        font-family: var(--font-en);
        font-size: 10px;
        letter-spacing: 0.22em;
        font-weight: 700;
        color: var(--mist);
        text-transform: uppercase;
      }
      .post-share-buttons {
        display: flex;
        gap: 8px;
      }
      .share-btn {
        font-family: var(--font-en);
        font-size: 11px;
        letter-spacing: 0.08em;
        font-weight: 500;
        color: var(--slate);
        background: var(--white);
        border: 1px solid var(--hairline);
        border-radius: 2px;
        padding: 8px 16px;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: all 0.2s;
      }
      .share-btn:hover {
        border-color: var(--navy);
        color: var(--navy);
      }
      .share-btn.copied {
        background: var(--navy);
        border-color: var(--navy);
        color: var(--white);
      }

      .post-nav {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-top: 48px;
      }
      .post-nav-item {
        border: 1px solid var(--hairline);
        border-radius: 2px;
        padding: 24px;
        text-decoration: none;
        display: block;
        transition: all 0.25s;
        background: var(--white);
      }
      .post-nav-item:hover {
        border-color: var(--navy);
        background: var(--ivory);
      }
      .post-nav-item.disabled {
        opacity: 0.35;
        pointer-events: none;
      }
      .post-nav-dir {
        font-family: var(--font-en);
        font-size: 10px;
        letter-spacing: 0.22em;
        font-weight: 700;
        color: var(--mist);
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      .post-nav-item.next .post-nav-dir {
        justify-content: flex-end;
      }
      .post-nav-item.next {
        text-align: right;
      }
      .post-nav-title {
        font-family: var(--font-en);
        font-size: 15px;
        font-weight: 400;
        color: var(--obsidian);
        line-height: 1.4;
      }
      body.ko .post-nav-title {
        font-family: var(--font-kr);
        font-weight: 500;
        line-height: 1.45;
      }

      /* ─── RESPONSIVE ───────────────────────────────────────────────── */
      @media (max-width: 960px) {
        .post-hero {
          padding: 150px 28px 72px;
        }
        .post-body {
          padding: 56px 28px 64px;
        }
        .post-body h2 {
          margin-top: 48px;
        }
        .post-footer {
          padding: 0 28px 56px;
        }
        .post-nav {
          grid-template-columns: 1fr;
          gap: 10px;
        }
      }
      @media (max-width: 560px) {
        .post-hero {
          padding: 120px 20px 56px;
        }
        .post-body {
          padding: 40px 20px 48px;
        }
        .post-body p {
          font-size: 16px;
        }
        body.ko .post-body p {
          font-size: 15.5px;
        }
        .post-split {
          grid-template-columns: 1fr;
        }
        .post-footer {
          padding: 0 20px 48px;
        }
      }

      /* ─── READING PROGRESS ─────────────────────────────────────────── */
      #reading-progress {
        position: fixed;
        top: 0;
        left: 0;
        width: 0%;
        height: 2px;
        background: var(--navy);
        z-index: 2000;
        transition: width 0.08s linear;
        pointer-events: none;
      }

      /* ─── STICKY TOC ───────────────────────────────────────────────── */
      #post-toc {
        display: none;
      }
      @media (min-width: 1280px) {
        #post-toc {
          display: none; /* JS shows it after scroll */
          position: fixed;
          top: 50%;
          transform: translateY(-50%);
          right: 36px;
          width: 178px;
        }
        #post-toc.toc-visible {
          display: block;
        }
        #post-toc .toc-label {
          font-family: var(--font-en);
          font-size: 9px;
          letter-spacing: 0.22em;
          font-weight: 700;
          color: #999;
          text-transform: uppercase;
          margin-bottom: 14px;
        }
        #post-toc ol {
          list-style: none;
          padding: 0;
          margin: 0;
          border-left: 1px solid #ddd;
        }
        #post-toc ol li a {
          display: block;
          padding: 6px 0 6px 14px;
          font-family: var(--font-en);
          font-size: 11px;
          line-height: 1.5;
          color: #666;
          text-decoration: none;
          border-left: 2px solid transparent;
          margin-left: -1px;
          transition:
            color 0.2s,
            border-color 0.2s;
        }
        body.ko #post-toc ol li a {
          font-family: var(--font-kr);
        }
        #post-toc ol li a:hover {
          color: #333;
        }
        #post-toc ol li a.toc-active {
          color: #1b2a4e;
          border-left-color: #1b2a4e;
          font-weight: 600;
        }
      }

      /* ─── SECTION NUMBERS ──────────────────────────────────────────── */
      .sec-num {
        display: block;
        font-family: var(--font-en);
        font-size: 10px;
        letter-spacing: 0.22em;
        font-weight: 700;
        color: var(--navy);
        margin-bottom: 6px;
      }

      /* ─── BQ FEATURE (dark callout block) ──────────────────────────── */
      .bq-feature {
        background: var(--obsidian);
        padding: 56px 48px;
        margin: 64px 0;
        border-radius: 2px;
      }
      .bq-feature blockquote {
        border-left: none;
        padding: 0;
        margin: 0 auto;
        text-align: center;
        max-width: 720px;
        color: var(--white);
        font-family: var(--font-en);
        font-size: clamp(20px, 2.2vw, 27px);
        font-weight: 500;
        line-height: 1.6;
      }
      body.ko .bq-feature blockquote {
        font-family: var(--font-kr);
        font-size: clamp(19px, 2vw, 25px);
        line-height: 1.7;
        letter-spacing: -0.01em;
      }
      .bq-feature blockquote p {
        margin: 0;
        color: rgba(255, 255, 255, 0.9);
        font-family: inherit;
        font-size: inherit;
        font-weight: inherit;
        line-height: inherit;
      }
      .bq-feature blockquote p + p {
        margin-top: 16px;
        color: rgba(255, 255, 255, 0.6);
        font-size: 0.66em;
        font-weight: 400;
      }
      @media (max-width: 560px) {
        .bq-feature {
          padding: 52px 20px;
        }
      }

      /* ─── POST CTA ─────────────────────────────────────────────────── */
      .post-cta {
        background: var(--navy);
        padding: 88px var(--pad-h);
        text-align: center;
      }
      .post-cta-eyebrow {
        font-family: var(--font-en);
        font-size: 10px;
        letter-spacing: 0.22em;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.4);
        text-transform: uppercase;
        margin-bottom: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .post-cta-eyebrow::before,
      .post-cta-eyebrow::after {
        content: '';
        width: 22px;
        height: 1px;
        background: rgba(255, 255, 255, 0.28);
      }
      .post-cta-heading {
        font-family: var(--font-en);
        font-size: clamp(22px, 2.6vw, 36px);
        font-weight: 400;
        color: var(--white);
        line-height: 1.3;
        letter-spacing: 0.015em;
        max-width: 680px;
        margin: 0 auto 40px;
      }
      body.ko .post-cta-heading {
        font-family: var(--font-kr);
        font-weight: 500;
        letter-spacing: -0.01em;
        line-height: 1.45;
        font-size: clamp(20px, 2.2vw, 32px);
      }
      .post-cta-btn {
        font-family: var(--font-en);
        font-size: 11px;
        letter-spacing: 0.14em;
        font-weight: 700;
        color: var(--navy);
        background: var(--white);
        border: 1px solid var(--white);
        border-radius: 2px;
        padding: 14px 36px;
        text-decoration: none;
        display: inline-block;

    <script>
      let currentLang = 'ko';

      function goIndex(hash, tab) {
        let url = 'index.html?lang=' + currentLang;
        if (tab) url += '&tab=' + tab;
        url += hash || '';
        window.location.href = url;
      }
      function togMob() {
        document.getElementById('mobNav').classList.toggle('open');
      }
      function closeMob() {
        document.getElementById('mobNav').classList.remove('open');
      }

      window.addEventListener(
        'scroll',
        () => {
          document.getElementById('nav').classList.toggle('scrolled', scrollY > 30);
        },
        { passive: true }
      );

      const io = new IntersectionObserver(
        (entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) {
              e.target.classList.add('in');
              io.unobserve(e.target);
            }
          });
        },
        { threshold: 0.08 }
      );
      document.querySelectorAll('.fade').forEach((el) => io.observe(el));

      /* ── share ────────────────────────────────────────────────────── */
      function copyLink(btn) {
        navigator.clipboard.writeText(window.location.href).then(() => {
          btn.classList.add('copied');
          btn.textContent = T[currentLang]['share-copied'];
          setTimeout(() => {
            btn.classList.remove('copied');
            btn.textContent = T[currentLang]['share-copy'];
          }, 1800);
        });
      }
      function setupShareLinks() {
        const url = encodeURIComponent(window.location.href);
        const title = encodeURIComponent(document.title);
        document.getElementById('share-x').href = `https://twitter.com/intent/tweet?text=${title}&url=${url}`;
        document.getElementById('share-li').href = `https://www.linkedin.com/sharing/share-offsite/?url=${url}`;
      }

      /* ── i18n ─────────────────────────────────────────────────────── */
      const T = window.POST_T;

      function setLang(l) {
        currentLang = l;
        document.documentElement.setAttribute('lang', l);
        document.body.classList.toggle('ko', l === 'ko');
        Object.keys(T[l]).forEach((id) => {
          const el = document.getElementById(id);
          if (el) el.innerHTML = T[l][id];
        });
        document
          .querySelectorAll('.lang-switch button')
          .forEach((btn) => btn.classList.toggle('on', btn.dataset.lang === l));
        document.title =
          l === 'ko'
            ? 'OpenAI의 Astra가 진짜 팔고 있는 건 무엇인가 — Insight by ImperAI'
            : 'What OpenAI’s Astra Is Really Selling — Insight by ImperAI';
        const figures = [
          ['fig1-img', 'fig-01-two-scores-'],
          ['fig2-img', 'fig-02-score-cost-'],
          ['fig3-img', 'fig-03-bundled-vs-modular-'],
        ];
        figures.forEach(([id, prefix]) => {
          const figure = document.getElementById(id);
          if (figure) figure.src = `insight/assets/openai-astra/${prefix}${l}.svg`;
        });
        setupShareLinks();
        addSectionNumbers();
      }

      /* ── section numbers ──────────────────────────────────────────── */
      function addSectionNumbers() {
        document.querySelectorAll('.post-body h2').forEach((h2, i) => {
          const existing = h2.querySelector('.sec-num');
          if (existing) existing.remove();
          const span = document.createElement('span');
          span.className = 'sec-num';
          span.textContent = String(i + 1).padStart(2, '0');
          h2.insertBefore(span, h2.firstChild);
        });
      }

      /* TOC: show after hero passes, highlight active section */
      const tocEl = document.getElementById('post-toc');
      const heroVisual = document.querySelector('.post-hero');

      function updateTocVisibility() {
        if (!heroVisual || !tocEl) return;
        const heroBottom = heroVisual.getBoundingClientRect().bottom;
        tocEl.classList.toggle('toc-visible', heroBottom < 0);
      }
      window.addEventListener('scroll', updateTocVisibility, { passive: true });
      updateTocVisibility();

      /* TOC click: prevent base-href redirect, scroll to section instead */
      const tocList = document.getElementById('toc-list');
      if (tocList) {
        tocList.addEventListener('click', function (e) {
          const a = e.target.closest('a[href^="#"]');
          if (!a) return;
          const id = a.getAttribute('href').slice(1);
          const target = document.getElementById(id);
          if (target) {
            e.preventDefault();
            const navEl = document.getElementById('nav');
            const offset = navEl ? navEl.offsetHeight + 16 : 88;
            const top = target.getBoundingClientRect().top + window.scrollY - offset;
            window.scrollTo({ top, behavior: 'smooth' });
          }
        });
      }

      /* active section highlight */
      const tocObserver = new IntersectionObserver(
        (entries) => {
          entries.forEach((e) => {
            const id = e.target.id;
            const link = document.querySelector(`#toc-list a[href="#${id}"]`);
            if (!link) return;
            if (e.isIntersecting) {
              document.querySelectorAll('#toc-list a').forEach((a) => a.classList.remove('toc-active'));
              link.classList.add('toc-active');
            }
          });
        },
        { rootMargin: '-15% 0px -75% 0px' }
      );
      document.querySelectorAll('.post-body h2[id]').forEach((h2) => tocObserver.observe(h2));

      /* ── reading progress ─────────────────────────────────────────── */
      (function () {
        const bar = document.getElementById('reading-progress');
        const article = document.querySelector('article');
        if (!bar || !article) return;
        window.addEventListener(
          'scroll',
          () => {
            const top = article.getBoundingClientRect().top + window.scrollY;
            const height = article.offsetHeight - window.innerHeight;
            const pct = Math.max(0, Math.min(100, ((window.scrollY - top) / height) * 100));
            bar.style.width = pct + '%';
          },
          { passive: true }
        );
      })();

      const urlLang = new URLSearchParams(window.location.search).get('lang');
      setLang(urlLang === 'en' ? 'en' : 'ko');
    </script>
