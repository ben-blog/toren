<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" role="img" aria-label="The higher score was also the cheaper run" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1672" height="941" fill="#f7f6f2"/><rect x="0.5" y="0.5" width="1671" height="940" fill="none" stroke="#d9d6ce" stroke-width="1"/><rect x="96" y="88" width="34" height="3" fill="#1b2a4e"/><text x="96" y="142" text-anchor="start" font-family="'Jost','Inter',system-ui,sans-serif" font-size="32" font-weight="600" fill="#0a0a0a" letter-spacing="0">The higher score was also the cheaper run</text><rect x="1090" y="210" width="440" height="560" rx="6" fill="#ebf1fb" stroke="none"/><text x="830" y="276" text-anchor="middle" font-family="'Jost','Inter',system-ui,sans-serif" font-size="25" font-weight="600" fill="#5e6675" letter-spacing="0">Standard harness</text><text x="1310" y="276" text-anchor="middle" font-family="'Jost','Inter',system-ui,sans-serif" font-size="25" font-weight="600" fill="#1b2a4e" letter-spacing="0">Provider Adapter</text><line x1="112" y1="306" x2="1530" y2="306" stroke="#d9d6ce" stroke-width="1.5"/><text x="112" y="394" text-anchor="start" font-family="'Jost','Inter',system-ui,sans-serif" font-size="24" font-weight="400" fill="#5e6675" letter-spacing="0">ARC-AGI-3 score</text><text x="830" y="400" text-anchor="middle" font-family="'Jost','Inter',system-ui,sans-serif" font-size="42" font-weight="600" fill="#5e6675" letter-spacing="0">62.7%</text><text x="1310" y="400" text-anchor="middle" font-family="'Jost','Inter',system-ui,sans-serif" font-size="42" font-weight="600" fill="#1b2a4e" letter-spacing="0">99.9%</text><line x1="112" y1="444" x2="1530" y2="444" stroke="#e8e6e0" stroke-width="1"/><text x="112" y="506" text-anchor="start" font-family="'Jost','Inter',system-ui,sans-serif" font-size="24" font-weight="400" fill="#5e6675" letter-spacing="0">Cost per benchmark run</text><text x="830" y="512" text-anchor="middle" font-family="'Jost','Inter',system-ui,sans-serif" font-size="42" font-weight="600" fill="#5e6675" letter-spacing="0">$26,098</text><text x="1310" y="512" text-anchor="middle" font-family="'Jost','Inter',system-ui,sans-serif" font-size="42" font-weight="600" fill="#1b2a4e" letter-spacing="0">$18,817</text><line x1="112" y1="556" x2="1530" y2="556" stroke="#e8e6e0" stroke-width="1"/><text x="112" y="618" text-anchor="start" font-family="'Jost','Inter',system-ui,sans-serif" font-size="24" font-weight="400" fill="#5e6675" letter-spacing="0">Time on 167 shared tasks</text><text x="830" y="624" text-anchor="middle" font-family="'Jost','Inter',system-ui,sans-serif" font-size="30" font-weight="400" fill="#5e6675" letter-spacing="0">baseline (1.0×)</text><text x="1310" y="624" text-anchor="middle" font-family="'Jost','Inter',system-ui,sans-serif" font-size="30" font-weight="600" fill="#1b2a4e" letter-spacing="0">3.66× faster</text><line x1="112" y1="668" x2="1530" y2="668" stroke="#e8e6e0" stroke-width="1"/><text x="112" y="730" text-anchor="start" font-family="'Jost','Inter',system-ui,sans-serif" font-size="24" font-weight="400" fill="#5e6675" letter-spacing="0">Token use</text><text x="830" y="736" text-anchor="middle" font-family="'Jost','Inter',system-ui,sans-serif" font-size="30" font-weight="400" fill="#5e6675" letter-spacing="0">baseline (1.0×)</text><text x="1310" y="736" text-anchor="middle" font-family="'Jost','Inter',system-ui,sans-serif" font-size="30" font-weight="600" fill="#1b2a4e" letter-spacing="0">nearly half</text><text x="1420" y="506" text-anchor="start" font-family="'Jost','Inter',system-ui,sans-serif" font-size="22" font-weight="600" fill="#27704a" letter-spacing="0">−27.9%</text><text x="96" y="858" text-anchor="start" font-family="'Jost','Inter',system-ui,sans-serif" font-size="23" font-weight="400" fill="#5e6675" letter-spacing="0" font-style="italic">More reasoning effort can finish a task in fewer attempts, so the total bill goes down.</text><text x="96" y="896" text-anchor="start" font-family="'Jost','Inter',system-ui,sans-serif" font-size="20" font-weight="400" fill="#a8adb7" letter-spacing="0.02em">Source: ARC Prize · ARC-AGI-3</text></svg>