<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941" role="img" aria-label="Bundle the harness, or open it up and swap models" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1672" height="941" fill="#f7f6f2"/><rect x="0.5" y="0.5" width="1671" height="940" fill="none" stroke="#d9d6ce" stroke-width="1"/><rect x="96" y="88" width="34" height="3" fill="#1b2a4e"/><text x="96" y="142" text-anchor="start" font-family="'Jost','Inter',system-ui,sans-serif" font-size="32" font-weight="600" fill="#0a0a0a" letter-spacing="0">Bundle the harness, or open it up and swap models</text><text x="112" y="312" text-anchor="start" font-family="'Jost','Inter',system-ui,sans-serif" font-size="26" font-weight="600" fill="#1b2a4e" letter-spacing="0">Bundled</text><text x="112" y="346" text-anchor="start" font-family="'Jost','Inter',system-ui,sans-serif" font-size="20" font-weight="400" fill="#a8adb7" letter-spacing="0">model and harness sold together</text><rect x="430" y="210" width="630" height="220" rx="8" fill="#ffffff" stroke="#1b2a4e" stroke-width="2"/><text x="456" y="250" text-anchor="start" font-family="'Jost','Inter',system-ui,sans-serif" font-size="20" font-weight="400" fill="#5e6675" letter-spacing="0.02em">Vendor execution environment</text><rect x="458" y="272" width="280" height="130" rx="6" fill="#f7f6f2" stroke="#d9d6ce" stroke-width="1.5"/><text x="598" y="349" text-anchor="middle" font-family="'Jost','Inter',system-ui,sans-serif" font-size="27" font-weight="500" fill="#1b2a4e" letter-spacing="0">Model</text><rect x="760" y="272" width="272" height="130" rx="6" fill="#ebf1fb" stroke="#b9c8e2" stroke-width="1.5"/><text x="896" y="349" text-anchor="middle" font-family="'Jost','Inter',system-ui,sans-serif" font-size="27" font-weight="500" fill="#1b2a4e" letter-spacing="0">Harness</text><line x1="1062" y1="337" x2="1117" y2="337" stroke="#1b2a4e" stroke-width="3.5" stroke-linecap="round"/><path d="M 1115 329 L 1128 337 L 1115 345" fill="none" stroke="#1b2a4e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="1140" y="272" width="436" height="130" rx="6" fill="#f7f6f2" stroke="#d9d6ce" stroke-width="1.5"/><text x="1358" y="328" text-anchor="middle" font-family="'Jost','Inter',system-ui,sans-serif" font-size="25" font-weight="600" fill="#1b2a4e" letter-spacing="0">Optimized out of the box</text><text x="1358" y="362" text-anchor="middle" font-family="'Jost','Inter',system-ui,sans-serif" font-size="21" font-weight="400" fill="#5e6675" letter-spacing="0">lock-in comes with it</text><text x="112" y="572" text-anchor="start" font-family="'Jost','Inter',system-ui,sans-serif" font-size="26" font-weight="600" fill="#1b2a4e" letter-spacing="0">Modular</text><text x="112" y="606" text-anchor="start" font-family="'Jost','Inter',system-ui,sans-serif" font-size="20" font-weight="400" fill="#a8adb7" letter-spacing="0">Agent = Model + Harness</text><rect x="430" y="470" width="630" height="220" rx="8" fill="#ffffff" stroke="#1b2a4e" stroke-width="2"/><text x="456" y="510" text-anchor="start" font-family="'Jost','Inter',system-ui,sans-serif" font-size="20" font-weight="400" fill="#5e6675" letter-spacing="0.02em">A harness you choose and operate</text><rect x="458" y="532" width="182" height="130" rx="6" fill="#ebf1fb" stroke="#b9c8e2" stroke-width="1.5"/><text x="549.0" y="609" text-anchor="middle" font-family="'Jost','Inter',system-ui,sans-serif" font-size="24" font-weight="500" fill="#1b2a4e" letter-spacing="0">Model A</text><rect x="654" y="532" width="182" height="130" rx="6" fill="#ffffff" stroke="#a8adb7" stroke-width="1.5" stroke-dasharray="6 7"/><text x="745.0" y="609" text-anchor="middle" font-family="'Jost','Inter',system-ui,sans-serif" font-size="24" font-weight="400" fill="#5e6675" letter-spacing="0">Model B</text><rect x="850" y="532" width="182" height="130" rx="6" fill="#ffffff" stroke="#a8adb7" stroke-width="1.5" stroke-dasharray="6 7"/><text x="941.0" y="609" text-anchor="middle" font-family="'Jost','Inter',system-ui,sans-serif" font-size="24" font-weight="400" fill="#5e6675" letter-spacing="0">Model C</text><line x1="1062" y1="597" x2="1117" y2="597" stroke="#1b2a4e" stroke-width="3.5" stroke-linecap="round"/><path d="M 1115 589 L 1128 597 L 1115 605" fill="none" stroke="#1b2a4e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="1140" y="532" width="436" height="130" rx="6" fill="#f7f6f2" stroke="#d9d6ce" stroke-width="1.5"/><text x="1358" y="588" text-anchor="middle" font-family="'Jost','Inter',system-ui,sans-serif" font-size="25" font-weight="600" fill="#1b2a4e" letter-spacing="0">Lower switching cost</text><text x="1358" y="622" text-anchor="middle" font-family="'Jost','Inter',system-ui,sans-serif" font-size="21" font-weight="400" fill="#5e6675" letter-spacing="0">you carry the ops</text><rect x="96" y="758" width="1480" height="128" rx="6" fill="#faf1ef" stroke="#e5c3bc" stroke-width="1.5"/><rect x="96" y="758" width="6" height="128" rx="3" fill="#c0392b"/><text x="132" y="800" text-anchor="start" font-family="'Jost','Inter',system-ui,sans-serif" font-size="24" font-weight="600" fill="#c0392b" letter-spacing="0">Harness premium</text><text x="132" y="838" text-anchor="start" font-family="'Jost','Inter',system-ui,sans-serif" font-size="22" font-weight="400" fill="#5e6675" letter-spacing="0">The band of performance that stands out inside a vendor’s environment and may not follow you out of it.</text><text x="132" y="870" text-anchor="start" font-family="'Jost','Inter',system-ui,sans-serif" font-size="22" font-weight="400" fill="#5e6675" letter-spacing="0" font-style="italic">Either way, you cannot size it without measuring it on your own work.</text></svg>