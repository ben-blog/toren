<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#141E33"/>
    </linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBFAF5"/>
      <stop offset="1" stop-color="#F2ECDD"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Title -->
  <text x="56" y="64" fill="#EFE9DA" font-size="30" font-weight="700">같은 구조, 세 영역</text>
  <text x="56" y="94" fill="#9AA6BF" font-size="16">은행도, 도로도, AI도 — 신뢰는 모델이 아니라 같은 층위의 구조에서 만들어집니다.</text>

  <!-- Domain headers -->
  <text x="394" y="150" fill="#EFE9DA" font-size="21" font-weight="700" text-anchor="middle">은행</text>
  <text x="698" y="150" fill="#EFE9DA" font-size="21" font-weight="700" text-anchor="middle">도로</text>
  <text x="1002" y="150" fill="#5B9BFF" font-size="21" font-weight="700" text-anchor="middle">AI 에이전트</text>

  <!-- Shared-layer continuity lines -->
  <line x1="252" y1="264" x2="1144" y2="264" stroke="#2563EB" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="252" y1="452" x2="1144" y2="452" stroke="#2563EB" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="252" y1="640" x2="1144" y2="640" stroke="#2563EB" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Row labels -->
  <g>
    <rect x="56" y="204" width="180" height="120" rx="14" fill="#2563EB"/>
    <text x="146" y="256" fill="#FFFFFF" font-size="19" font-weight="700" text-anchor="middle">① 사전 게이트</text>
    <text x="146" y="282" fill="#CFE0FF" font-size="13" text-anchor="middle">실행 전 통제</text>
  </g>
  <g>
    <rect x="56" y="392" width="180" height="120" rx="14" fill="#2563EB"/>
    <text x="146" y="444" fill="#FFFFFF" font-size="19" font-weight="700" text-anchor="middle">② 기록</text>
    <text x="146" y="470" fill="#CFE0FF" font-size="13" text-anchor="middle">무슨 일이 있었나</text>
  </g>
  <g>
    <rect x="56" y="580" width="180" height="120" rx="14" fill="#2563EB"/>
    <text x="146" y="632" fill="#FFFFFF" font-size="19" font-weight="700" text-anchor="middle">③ 책임</text>
    <text x="146" y="658" fill="#CFE0FF" font-size="13" text-anchor="middle">누가 답하나</text>
  </g>

  <!-- Row 1: Gate -->
  <rect x="252" y="180" width="284" height="168" rx="14" fill="url(#cell)"/>
  <text x="394" y="270" fill="#14213D" font-size="17" text-anchor="middle">감사·내부통제 규정</text>
  <text x="394" y="296" fill="#5A6070" font-size="15" text-anchor="middle">권한 체계</text>

  <rect x="556" y="180" width="284" height="168" rx="14" fill="url(#cell)"/>
  <text x="698" y="258" fill="#14213D" font-size="17" text-anchor="middle">신호등·교통법규</text>
  <text x="698" y="284" fill="#14213D" font-size="17" text-anchor="middle">면허 제도</text>

  <rect x="860" y="180" width="284" height="168" rx="14" fill="url(#cell)" stroke="#2563EB" stroke-width="2"/>
  <text x="1002" y="270" fill="#14213D" font-size="17" font-weight="700" text-anchor="middle">실행 전 판정 게이트</text>

  <!-- Row 2: Record -->
  <rect x="252" y="368" width="284" height="168" rx="14" fill="url(#cell)"/>
  <text x="394" y="446" fill="#14213D" font-size="17" text-anchor="middle">복식부기 장부</text>
  <text x="394" y="472" fill="#5A6070" font-size="15" text-anchor="middle">대차 대조</text>

  <rect x="556" y="368" width="284" height="168" rx="14" fill="url(#cell)"/>
  <text x="698" y="446" fill="#14213D" font-size="17" text-anchor="middle">블랙박스</text>
  <text x="698" y="472" fill="#5A6070" font-size="15" text-anchor="middle">사고 기록</text>

  <rect x="860" y="368" width="284" height="168" rx="14" fill="url(#cell)" stroke="#2563EB" stroke-width="2"/>
  <text x="1002" y="438" fill="#14213D" font-size="17" font-weight="700" text-anchor="middle">결정 기록 한 줄</text>
  <text x="1002" y="464" fill="#5A6070" font-size="13.5" text-anchor="middle">무엇을·왜·권한·근거</text>

  <!-- Row 3: Accountability -->
  <rect x="252" y="556" width="284" height="168" rx="14" fill="url(#cell)"/>
  <text x="394" y="634" fill="#14213D" font-size="17" text-anchor="middle">틀리면 답해야 하는</text>
  <text x="394" y="660" fill="#14213D" font-size="17" text-anchor="middle">규정·감독</text>

  <rect x="556" y="556" width="284" height="168" rx="14" fill="url(#cell)"/>
  <text x="698" y="634" fill="#14213D" font-size="17" text-anchor="middle">보험·과실</text>
  <text x="698" y="660" fill="#5A6070" font-size="15" text-anchor="middle">배상</text>

  <rect x="860" y="556" width="284" height="168" rx="14" fill="url(#cell)" stroke="#2563EB" stroke-width="2"/>
  <text x="1002" y="648" fill="#14213D" font-size="17" font-weight="700" text-anchor="middle">답할 수 있는 기록</text>

  <!-- Caption -->
  <text x="600" y="772" fill="#9AA6BF" font-size="15.5" text-anchor="middle">도메인은 달라도 신뢰를 만드는 구조는 같습니다. 신뢰는 모델 안이 아니라, 이 구조에 있습니다.</text>
</svg>
