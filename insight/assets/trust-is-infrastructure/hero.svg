<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E18"/>
      <stop offset="0.55" stop-color="#0E1524"/>
      <stop offset="1" stop-color="#080A11"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2E6BFF" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#2E6BFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#2E6BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cubeTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3EEDF"/>
      <stop offset="1" stop-color="#CFE0FF"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FA8FF"/>
      <stop offset="1" stop-color="#33507F"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E5A8C"/>
      <stop offset="1" stop-color="#1B2A4E"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E6BFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2E6BFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2E6BFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- faint ledger gridlines -->
  <g stroke="#2A3A5E" stroke-opacity="0.16" stroke-width="1">
    <line x1="0" y1="120" x2="1920" y2="120"/>
    <line x1="0" y1="210" x2="1920" y2="210"/>
    <line x1="0" y1="300" x2="1920" y2="300"/>
    <line x1="0" y1="390" x2="1920" y2="390"/>
    <line x1="0" y1="480" x2="1920" y2="480"/>
    <line x1="0" y1="570" x2="1920" y2="570"/>
    <line x1="0" y1="660" x2="1920" y2="660"/>
    <line x1="0" y1="750" x2="1920" y2="750"/>
    <line x1="0" y1="840" x2="1920" y2="840"/>
    <line x1="0" y1="930" x2="1920" y2="930"/>
  </g>

  <!-- halo behind the core -->
  <ellipse cx="1300" cy="560" rx="620" ry="520" fill="url(#halo)"/>

  <!-- cradle: concentric rounded frames holding the core -->
  <g fill="none">
    <rect x="1130" y="430" width="340" height="260" rx="16" stroke="#8FB2FF" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="1030" y="360" width="540" height="400" rx="20" stroke="#6E90D8" stroke-opacity="0.34" stroke-width="1.5"/>
    <rect x="910" y="285" width="780" height="550" rx="26" stroke="#4E6BA8" stroke-opacity="0.22" stroke-width="1.5"/>
    <rect x="770" y="205" width="1060" height="710" rx="32" stroke="#3B547F" stroke-opacity="0.14" stroke-width="1.5"/>
  </g>

  <!-- rails with cool-blue glow -->
  <g stroke="url(#rail)" stroke-width="2">
    <line x1="360" y1="560" x2="1130" y2="560"/>
    <line x1="1470" y1="560" x2="1900" y2="560"/>
    <line x1="1300" y1="120" x2="1300" y2="430"/>
    <line x1="1300" y1="690" x2="1300" y2="980"/>
  </g>

  <!-- gate bars -->
  <g fill="#2E6BFF" fill-opacity="0.5">
    <rect x="1024" y="500" width="4" height="120" rx="2"/>
    <rect x="1004" y="520" width="4" height="80" rx="2"/>
    <rect x="1572" y="500" width="4" height="120" rx="2"/>
    <rect x="1592" y="520" width="4" height="80" rx="2"/>
  </g>

  <!-- glowing nodes at cradle corners -->
  <g fill="#CFE0FF">
    <circle cx="1130" cy="430" r="4"/>
    <circle cx="1470" cy="430" r="4"/>
    <circle cx="1130" cy="690" r="4"/>
    <circle cx="1470" cy="690" r="4"/>
  </g>

  <!-- luminous core cube -->
  <ellipse cx="1300" cy="580" rx="150" ry="130" fill="#2E6BFF" fill-opacity="0.45" filter="url(#soft)"/>
  <g transform="translate(60,60)">
    <polygon points="1240,430 1360,500 1240,570 1120,500" fill="url(#cubeTop)"/>
    <polygon points="1120,500 1240,570 1240,710 1120,640" fill="url(#cubeLeft)"/>
    <polygon points="1360,500 1240,570 1240,710 1360,640" fill="url(#cubeRight)"/>
    <g stroke="#DCE8FF" stroke-opacity="0.85" stroke-width="1.5" fill="none" filter="url(#glow)">
      <polygon points="1240,430 1360,500 1240,570 1120,500"/>
      <line x1="1240" y1="570" x2="1240" y2="710"/>
      <line x1="1120" y1="500" x2="1120" y2="640"/>
      <line x1="1360" y1="500" x2="1360" y2="640"/>
    </g>
  </g>
</svg>
